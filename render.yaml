
services:
  - type: web
    name: dukaanpilot-ai
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && cd frontend && npm ci --include=optional && npm run build && cd .."
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 22.12.0
      - key: CORS_ORIGINS
        value: "*"
      - key: OLLAMA_BASE_URL
        value: "http://localhost:11434"
      - key: OLLAMA_MODEL
        value: "gemma2:2b"
      - key: DATABASE_PATH
        value: "dukaanpilot.db"
      - key: DEMO_MODE
        value: "true"
    # Render Free uses ephemeral storage.
    # SQLite data may be lost when the service restarts or redeploys.
    # Persistent disks require a supported paid plan.
